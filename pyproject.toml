[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "codemri"
version = "0.1.0"
description = "Compile codebases into context"
requires-python = ">=3.11"
dependencies = ["tree-sitter-java>=0.23,<0.24", "httpx>=0.27,<1", "PyYAML>=6,<7", "tree-sitter>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2", "tiktoken>=0.9,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["packages/engine"]
[tool.pytest.ini_options]
pythonpath = [".", "packages/engine"]

[tool.setuptools.package-data]
codemri = ["prompts/*.txt"]
